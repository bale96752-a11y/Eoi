<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Analyzer X</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- TensorFlow.js & Teachable Machine -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body class="text-gray-200 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="p-6 border-b border-gray-800 glass-card">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold cyber-font tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-fuchsia-500 cyber-glow">
                <i class="fa-solid fa-microchip-ai mr-2"></i>ANALYZER.X
            </h1>
            <span class="text-xs bg-cyan-500/10 text-cyan-400 px-3 py-1 rounded-full border border-cyan-500/30 uppercase tracking-wider cyber-font animate-pulse">
                Model: imjCzBMzE
            </span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-6xl w-full mx-auto p-4 md:p-8 grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
        
        <!-- Left Column: Input Image -->
        <div class="glass-card rounded-2xl p-6 border border-gray-800 shadow-2xl h-full flex flex-col justify-between">
            <div>
                <h2 class="text-lg font-semibold mb-4 text-cyan-400 flex items-center">
                    <i class="fa-solid fa-image mr-2"></i> อัปโหลดรูปภาพเพื่อวิเคราะห์
                </h2>
                
                <!-- Drag & Drop Area -->
                <div class="relative group border-2 border-dashed border-gray-700 hover:border-cyan-500 rounded-xl p-8 transition-all duration-300 text-center bg-black/20 cursor-pointer" id="drop-zone">
                    <input type="file" id="image-selector" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                    
                    <div id="upload-prompt">
                        <i class="fa-solid fa-cloud-arrow-up text-4xl text-gray-500 group-hover:text-cyan-400 mb-3 transition-colors"></i>
                        <p class="text-sm text-gray-400 group-hover:text-gray-200">ลากไฟล์มาวางที่นี่ หรือ <span class="text-cyan-400 font-semibold">คลิกเพื่อเลือกรูป</span></p>
                        <p class="text-xs text-gray-600 mt-1">รองรับ JPG, PNG, WEBP</p>
                    </div>

                    <!-- Preview Image -->
                    <img id="image-preview" src="#" alt="Preview" class="hidden max-h-64 mx-auto rounded-lg shadow-lg border border-gray-700 object-contain">
                </div>
            </div>

            <!-- Action Button -->
            <button id="btn-analyze" disabled class="mt-6 w-full py-4 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 disabled:from-gray-800 disabled:to-gray-800 disabled:text-gray-600 text-white font-bold tracking-wider uppercase transition-all duration-300 shadow-lg disabled:cursor-not-allowed flex justify-center items-center gap-2">
                <i class="fa-solid fa-wand-magic-sparkles"></i> เริ่มวิเคราะห์ข้อมูล
            </button>
        </div>

        <!-- Right Column: Results -->
        <div class="glass-card rounded-2xl p-6 border border-gray-800 shadow-2xl h-full flex flex-col justify-between">
            <div>
                <h2 class="text-lg font-semibold mb-4 text-fuchsia-400 flex items-center">
                    <i class="fa-solid fa-chart-simple mr-2"></i> ผลการวิเคราะห์จาก AI
                </h2>

                <!-- Loading State -->
                <div id="loading" class="hidden text-center py-12">
                    <div class="inline-block animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-cyan-500 mb-3"></div>
                    <p class="text-sm text-cyan-400 cyber-font tracking-widest">ANALYZING MATRIX...</p>
                </div>

                <!-- Initial State -->
                <div id="result-placeholder" class="text-center py-16 text-gray-600">
                    <i class="fa-solid fa-brain text-5xl mb-3 block"></i>
                    <p class="text-sm">ระบบพร้อมใช้งาน กรุณาเลือกรูปภาพ</p>
                </div>

                <!-- Chart Results -->
                <div id="result-container" class="hidden space-y-4">
                    <div id="label-container" class="space-y-4"></div>
                </div>
            </div>

            <!-- Summary Text Box -->
            <div id="summary-container" class="hidden mt-6 pt-4 border-t border-gray-800">
                <div class="bg-fuchsia-500/5 border border-fuchsia-500/20 rounded-xl p-4">
                    <h3 class="text-xs font-semibold text-fuchsia-400 uppercase tracking-wider mb-1"><i class="fa-solid fa-quote-left mr-1"></i> บทสรุปผลลัพธ์ (Summary)</h3>
                    <p id="summary-text" class="text-sm text-gray-300 leading-relaxed">-</p>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="p-4 text-center text-xs text-gray-600 border-t border-gray-900 bg-black/40">
        <p>© 2026 AI Analyzer X • Powered by Teachable Machine</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
